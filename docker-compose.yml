# Запуск: cp .env.docker.example .env.docker && docker compose --env-file .env.docker up -d --build
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: energycrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?вкажіть POSTGRES_PASSWORD у .env.docker}
      POSTGRES_DB: energycrm
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energycrm -d energycrm"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://energycrm:${POSTGRES_PASSWORD}@db:5432/energycrm
      SEED_MODE: ${SEED_MODE:-prod}
    ports:
      - "${APP_PORT:-3000}:3000"
volumes:
  pgdata:
